[package]
name = "zidane-inspector"
description = "FF9 character inspector: open a GLB export read-only, check it against the UV kit's numbers, click parts to see them on the model and the texture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# The program is `gaw` (Game Asset Workbench). `zidane-inspector` (src/bin) is the old name, kept as an alias.
[[bin]]
name = "gaw"
path = "src/main.rs"

[dependencies]
wb-core = { path = "../wb-core" }
serde_json.workspace = true
image.workspace = true
eframe = { version = "0.32", features = ["wgpu"] }
rfd = "0.15"
rigkit = { path = "../rigkit" }
